# Please refer to the documentation for more information on the configuration file.

base_config:
  dtype: float32
  num_episodes: 1000

env1:
  env_name: Pendulum-v1
  id: 0
  max_steps: 1000

env2:
  env_name: LunarLander-v3
  id: 1
  max_steps: 1000

env3:
  env_name: Hockey-v0
  env_type: gym
  id: 2
  mode: 0 # 0: normal, 1: shooting, 2: defense
  max_steps: 1000
  start_training_after_steps: 20000
  train_both: False
  train_all: False
  new_agents_after_eval: 20 # After 1000 episodes
  do_render: False
  weights:
    winner_weight: 10.0 # Winner reward
    closeness_puck_weight: 0.5 # Closer = better
    touch_puck_weight: 0.1 # Touching puck = better
    puck_direction_weight: 1.0 # Puck direction = better
    no_touch_penalty: -1.0 # Penalty for not touching puck after 10% of episode
    timed_penalty_active: True # More time ==> less rewardc

agent1:
  type: td3
  checkpoint: ../final_checkpoints/08-02-td3-foundation/checkpoint_best.pth
  opponent_names: ["opponent3", "opponent4", "opponent1", "opponent2"]
  env_id: 2
  eps: 1
  eval_freq: 50
  eval_episodes: 20
  discount: 0.99
  actor_hidden_sizes: [516, 256]
  critic_hidden_sizes: [1024, 516, 256]
  policy_delay: 3
  update_target_every: -1
  noise_sigma: 0.2
  noise_clip: 0.8
  noise_beta: 1.0 # Pink noise
  memory_size: 100000
  buffer_type: BPER
  buffer_decay_steps: 100000
  buffer_alpha: 0.6
  buffer_beta: 0.4
  num_runs: 1
  mutation_config:
    enabled: false
  trainer_config:
    learning_rate_actor: 0.0003
    learning_rate_critic: 0.0003
    log_name: 08-02-td3-foundation-100k-fine-tuned
    batch_size: 256
  specialized_config:
    num_episodes: 15000
    do_render: False

opponent1:
  type: "basic_opponent_strong"

opponent2:
  type: "basic_opponent_weak"

opponent3:
  type: "td3"
  checkpoint: "Hockey-v0/td3/td3_not_cross_hockey_2025-01-28_09-26-13_100/checkpoint_best.pth"
  trainer_config:
    log_name: "OPPONENT_td3_foundation"

opponent4:
  type: "sac"
  checkpoint: ../final_checkpoints/01-30-sac-foundation/checkpoint_best.pth
  trainer_config:
    log_name: "OPPONENT_sac_foundation"
