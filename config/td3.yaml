agent5:
  type: "sac"
  checkpoint: null
  opponent_names:
    ["opponent3", "opponent4", "opponent5", "opponent1", "opponent2"]
  env_id: 2
  tau: 0.005 # Target network update rate (Soft update)
  memory_size: 1000000
  buffer_type: ER
  discount: 0.98 # Discount factor
  alpha: 0.1 # Entropy regularization coefficient
  alpha_lr: 0.0003 # Learning rate for alpha
  log_std_min: -20 #lower bound for log_std
  log_std_max: 2 #upper bound for log_std
  actor_hidden_sizes: [512, 256]
  critic_hidden_sizes: [512, 256, 64]
  alpha_tuning: True
  trainer_config:
    learning_rate_actor: 0.0003
    learning_rate_critic: 0.0003
    log_name: buffer_eval_foundation/sac-er
    batch_size: 512
  specialized_config:
    num_episodes: 60000
    do_render: False

opponent1:
  type: "basic_opponent_strong"

opponent2:
  type: "basic_opponent_weak"

opponent3:
  checkpoint: "../final_checkpoints/07-02_moe_foundation/checkpoint_best.pth"
  type: moe
  agent_a_path: "final_checkpoints/08-02-sac-ft/checkpoint_best.pth"
  agent_a_type: "sac"
  agent_b_path: "final_checkpoints/08-02-td3-ft-catch_bonus/checkpoint_last.pth"
  agent_b_type: "td3"
  buffer_type: ER
  gamma: 0.99
  hidden_size: [512, 512]
  memory_size: 100000
  mutation_config:
    enabled: false
  trainer_config:
    batch_size: 512
    beta1: 0.9
    beta2: 0.999
    learning_rate: 0.003
    log_freq: 10
    log_name: "DELETE-moe-ft-win-loose-dist"

opponent4:
  type: "sac"
  checkpoint: "../final_checkpoints/19-02-sac-ft-50k/checkpoint_last.pth"
  env_id: 0
  tau: 0.005 # Target network update rate (Soft update)
  memory_size: 1000000
  buffer_type: BER
  discount: 0.98 # Discount factor
  alpha: 0.1 # Entropy regularization coefficient
  alpha_lr: 0.0003 # Learning rate for alpha
  log_std_min: -20 #lower bound for log_std
  log_std_max: 2 #upper bound for log_std
  actor_hidden_sizes: [512, 256]
  critic_hidden_sizes: [512, 256, 64]
  alpha_tuning: True
  trainer_config:
    learning_rate_actor: 0.0003
    learning_rate_critic: 0.0003
    log_name: DELETE-sac-ft-win-loose-dist
    batch_size: 512

opponent5:
  type: "td3"
  checkpoint: "../final_checkpoints/19-02-td3-ft-50k/checkpoint_last.pth"
