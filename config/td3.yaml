# Please refer to the documentation for more information on the configuration file.

base_config:
  dtype: float32
  num_episodes: 1000

env1:
  env_name: Pendulum-v1
  id: 0
  max_steps: 1000

env2:
  env_name: LunarLander-v3
  id: 1
  max_steps: 1000

env3:
  env_name: Hockey-v0
  env_type: gym
  id: 2
  mode: 0 # 0: normal, 1: shooting, 2: defense
  max_steps: 1000
  start_training_after_steps: 20000
  train_both: False
  train_all: False
  new_agents_after_eval: 20 # After 1000 episodes
  do_render: True

agent1:
  type: td3
  # checkpoint: Hockey-v0/td3/td3_not_cross_hockey_2025-01-28_09-26-13_100/checkpoint_last.pth
  opponent_names: ["opponent1"]
  env_id: 2
  eps: 1
  eval_freq: 50
  eval_episodes: 20
  discount: 0.99
  actor_hidden_sizes: [516, 256]
  critic_hidden_sizes: [1024, 516, 256]
  policy_delay: 3
  update_target_every: -1
  noise_sigma: 0.2
  noise_clip: 0.8
  noise_beta: 1.0 # Pink noise
  memory_size: 100000
  # buffer_type: BPER # Balanced Prioritized Experience Replay
  buffer_type: PER # Prioritized Experience Replay
  buffer_decay_steps: 15000000
  num_runs: 1
  mutation_config:
    enabled: false
  trainer_config:
    learning_rate_actor: 0.0003
    learning_rate_critic: 0.0003
    log_name: td3_per_100000_reward_based
    batch_size: 256
  specialized_config:
    num_episodes: 15000
    do_render: False

opponent1:
  type: "basic_opponent_strong"

opponent2:
  type: "basic_opponent_weak"
