# Please refer to the documentation for more information on the configuration file.

base_config:
  dtype: float32
  num_episodes: 1500
  do_render: False

env1:
  env_name: Pendulum-v1
  env_type: gym
  id: 0
  max_steps: 1000

env2:
  env_name: LunarLander-v3
  id: 1
  max_steps: 1000

agent1:
  type: sac
  env_id: 1
  tau: 0.005 # Target network update rate (Soft update)
  memory_size: 1000000
  discount: 0.99 # Discount factor
  alpha: 0.1 # Entropy regularization coefficient
  alpha_lr: 0.0003 # Learning rate for alpha
  log_std_min: -20 #lower bound for log_std
  log_std_max: 2 #upper bound for log_std
  actor_hidden_sizes: [256, 128]
  critic_hidden_sizes: [256, 128, 64]
  alpha_tuning: True
  trainer_config:
    learning_rate_actor: 0.0003
    learning_rate_critic: 0.0003
    log_name: agent_sac_new_env
    batch_size: 256
