# Please refer to the documentation for more information on the configuration file.

base_config:
  dtype: float32
  num_episodes: 1000

env1:
  env_name: HalfCheetah-v3
  id: 0
  max_steps: 1000
  start_training_after_steps: 20000 # 20k for each agent

env2:
  env_name: LunarLander-v3
  id: 1
  max_steps: 1000
  start_training_after_steps: 20000 # 20k for each agent

env3:
  env_name: Hockey-v0
  env_type: gym
  id: 2
  max_steps: 1000
  start_training_after_steps: 20000 # 20k for each agent

# HalfCheetah
agent1:
  type: td3
  checkpoint: null
  env_id: 0
  eps: 1
  eval_freq: 50
  eval_episodes: 20
  discount: 0.95
  actor_hidden_sizes: [256, 256]
  critic_hidden_sizes: [256, 256, 128]
  policy_delay: 3
  update_target_every: -1
  noise_sigma: 0.2
  noise_clip: 0.8
  noise_beta: 1.0 # Pink noise
  memory_size: 100000
  buffer_type: ER # Buffer type: PER, BER, ER, BPER
  buffer_decay_steps: 100000
  buffer_alpha: 0.6
  buffer_beta: 0.4
  num_runs: 1
  mutation_config:
    enabled: false
  trainer_config:
    learning_rate_actor: 0.0001
    learning_rate_critic: 0.0001
    log_name: halfcheetah_eval/td3-er
    batch_size: 256
  specialized_config:
    num_episodes: 1000
    do_render: False

