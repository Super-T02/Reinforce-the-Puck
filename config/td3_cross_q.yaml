# Please refer to the documentation for more information on the configuration file.

base_config:
  dtype: float32
  num_episodes: 1000

env1:
  env_name: Pendulum-v1
  id: 0
  max_steps: 1000

env2:
  env_name: LunarLander-v3
  id: 1
  max_steps: 1000

agent1:
  type: td3_cross
  checkpoint: null
  opponent:
    checkpoint: null
    weak: False
    type: basic_opponent
  env_id: 0
  eps: 1
  eval_freq: 50
  eval_episodes: 20
  actor_hidden_sizes: [516, 256]
  critic_hidden_sizes: [1024, 516, 256, 128]
  policy_delay: 2
  update_target_every: -1
  noise_sigma: 0.2
  noise_clip: 0.8
  noise_beta: 1.0 # Pink noise
  memory_size: 10000
  num_runs: 1
  mutation_config:
    enabled: false
    means: []
    mins: []
    maxs: []
    vars: []
    prob: []
    parameters: []
  trainer_config:
    learning_rate_actor: 0.001
    learning_rate_critic: 0.001
    log_name: td3_cross_pendulum
    batch_size: 256
  specialized_config:
    num_episodes: 1500
