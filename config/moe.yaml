base_config:
  dtype: float32
  num_episodes: 3000
  do_render: true

env1:
  env_name: Hockey-v0
  env_type: gym
  id: 0
  max_steps: 1000


agent1:
  type: moe
  opponent_names: ['opponent1']
  env_id: 0
  memory_size: 10000

  agent_a_path: "C:/Users/jonas/OneDrive/Desktop/checkpoints/sac_hockey_foundation_default/checkpoint_best.pth"
  agent_a_type: 'sac'
  agent_b_path: "C:/Users/jonas/OneDrive/Desktop/checkpoints/td3_hockey_foundation_default/checkpoint_best.pth"
  agent_b_type: 'td3'

  gamma: 0.99
  hidden_size: [512, 512]


  trainer_config:
    learning_rate: 0.003
    log_name: moe_hockey
    batch_size: 512


