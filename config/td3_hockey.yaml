# Please refer to the documentation for more information on the configuration file.

base_config:
  dtype: float32
  num_episodes: 1000

env1:
  env_name: Pendulum-v1
  id: 0
  max_steps: 1000

env2:
  env_name: LunarLander-v3
  id: 1
  max_steps: 1000

env3:
  env_name: Hockey-v0
  env_type: gym
  id: 2
  mode: 0 # 0: normal, 1: shooting, 2: defense
  max_steps: 1000
  do_render: True

agent1:
  type: td3
  checkpoint: basic_opponnent_1
  env_id: 2
  eps: 1
  discount: 0.95
  actor_hidden_sizes: [516, 256]
  critic_hidden_sizes: [516, 256, 128]
  policy_delay: 2
  update_target_every: -1
  tao: 0.005
  noise_sigma: 0.2
  noise_clip: 0.5
  memory_size: 1000000
  num_runs: 1
  mutation_config:
    enabled: false
    means: []
    mins: []
    maxs: []
    vars: []
    prob: []
    parameters: []
  trainer_config:
    learning_rate_actor: 0.0003
    learning_rate_critic: 0.0003
    log_name: td3_hockey_game1
    batch_size: 256
  specialized_config:
    num_episodes: 750
    do_render: True
