[tool.poetry]
name = "reinforce-the-puck"
version = "0.1.0"
description = "Dreamer Agent for the laser Hockey game"
authors = [
    "Tom Freudenmann <tom.freudenmann@student.uni-tuebingen.de>",
    "Jonathan Schwab <jonathan.schwab@student.uni-tuebingen.de>",
]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
hockey = { git = "https://github.com/martius-lab/hockey-env.git" }
pre-commit = "^4.0.1"
numpy = "<2.0"
matplotlib = "^3.10.0"
pandas = "^2.2.3"
pyyaml = "^6.0.2"
notebook = "^7.3.1"
argparse = "^1.4.0"
dill = "^0.3.9"
box2d-py = "^2.3.8"
swig = "^4.3.0"
pygame = "^2.6.1"
gymnasium = "^1.0.0"
tensorboard = "^2.18.0 "
jupyterlab = "^4.3.3"
ipympl = "^0.9.4"
pytest = "^8.3.4"
aiofiles = "^24.1.0"
tabulate = "^0.9.0"
yq = "^3.4.3"
imageio = "^2.37.0"
openskill = "^6.0.2"
flask = "^3.1.0"
tueplots = "^0.2.0"
tqdm = "^4.67.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
